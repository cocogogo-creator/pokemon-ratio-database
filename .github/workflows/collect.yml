name: Collect Pokecardex ratio threads

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install forum-dl
        run: |
          python -m pip install --upgrade pip

          pip install chardet
          pip install --no-deps forum-dl

          pip install \
            "pydantic<2" \
            beautifulsoup4 \
            lxml \
            requests \
            urllib3 \
            tenacity \
            dateparser \
            html2text \
            warcio

      - name: Test forum-dl
        run: |
          forum-dl --help

      - name: Collect Pokecardex threads
        shell: bash
        run: |
          mkdir -p data/threads
          : > data/errors.log

          while IFS= read -r url; do

            if [[ -z "$url" || "$url" =~ ^# ]]; then
              continue
            fi

            tid="$(printf '%s' "$url" | sed -n 's/.*[?&]t=\([0-9][0-9]*\).*/\1/p')"

            if [ -z "$tid" ]; then
              tid="$(printf '%s' "$url" | sha256sum | cut -c1-12)"
            fi

            echo ""
            echo "=========================================="
            echo "Collecting thread: $tid"
            echo "$url"
            echo "=========================================="

            if forum-dl \
              --no-files \
              --textify \
              -f jsonl \
              -o "data/threads/${tid}.jsonl" \
              "$url"
            then
              echo "SUCCESS: $tid"
            else
              echo "$url" >> data/errors.log
              echo "FAILED: $tid"
            fi

            sleep 3

          done < threads.txt

      - name: Merge corpus
        shell: bash
        run: |
          touch data/pokecardex_ratio_corpus.jsonl

          find data/threads \
            -type f \
            -name '*.jsonl' \
            -print0 \
            | sort -z \
            | xargs -0 -r cat \
            > data/pokecardex_ratio_corpus.jsonl

          echo ""
          echo "=========================================="
          echo "COLLECTION SUMMARY"
          echo "=========================================="

          echo "Thread files collected:"
          find data/threads -type f -name '*.jsonl' | wc -l

          echo "Corpus lines:"
          wc -l data/pokecardex_ratio_corpus.jsonl

          echo "Failed URLs:"
          cat data/errors.log || true

      - name: Save results to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Collect Pokecardex ratio corpus"
            git push
          fi

      - name: Upload corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokecardex-ratio-corpus
          path: |
            data/pokecardex_ratio_corpus.jsonl
            data/threads/
            data/errors.log
          if-no-files-found: warn
          retention-days: 30
