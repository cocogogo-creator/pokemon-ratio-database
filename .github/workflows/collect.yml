name: Collect Pokecardex ratio threads

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install forum-dl
        run: |
          python -m pip install --upgrade pip
          pip install forum-dl

      - name: Collect threads
        shell: bash
        run: |
          mkdir -p data/threads
          : > data/errors.log

          while IFS= read -r url; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue

            tid="$(printf '%s' "$url" | sed -n 's/.*[?&]t=\([0-9][0-9]*\).*/\1/p')"
            echo "Collecting thread $tid"

            if forum-dl \
              --no-files \
              --textify \
              -f jsonl \
              -o "data/threads/${tid}.jsonl" \
              "$url"
            then
              echo "OK $tid"
            else
              echo "$url" >> data/errors.log
              echo "FAILED $tid"
            fi

            sleep 3
          done < threads.txt

      - name: Merge corpus
        shell: bash
        run: |
          find data/threads -type f -name '*.jsonl' -print0 \
            | sort -z \
            | xargs -0 cat > data/pokecardex_ratio_corpus.jsonl || true

          echo "Threads collected:"
          find data/threads -type f -name '*.jsonl' | wc -l

          echo "Corpus lines:"
          wc -l data/pokecardex_ratio_corpus.jsonl || true

      - name: Save results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Collect Pokecardex ratio corpus"
            git push
          fi

      - name: Upload corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokecardex-ratio-corpus
          path: data/
          if-no-files-found: warn
        
